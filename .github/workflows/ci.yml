name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Same toolchain as local development: everything runs inside the flake's
  # dev shell, so CI and `nix develop` cannot drift apart.
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: nix develop --command cargo fmt --all --check
      - name: Clippy
        run: nix develop --command cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: nix develop --command cargo test --workspace --locked
      - name: Licenses and advisories
        run: nix develop --command cargo deny check

  # Builds the package in the Nix sandbox (no network, no host tools) and runs
  # the test suite again there, which catches tests that silently depend on
  # the developer's machine.
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - name: Flake check
        run: nix flake check --print-build-logs
      - name: Nix formatting
        run: nix fmt -- --ci
