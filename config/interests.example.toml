# Interest profile used to score relevance. Copy to
# ~/.config/signalsift/interests.toml and edit freely: the text is given to
# the model as-is. A topic with a short description scores more consistently
# than a bare label. Changing this file changes the profile fingerprint, so
# older scores can be told apart from new ones.

about = """
A software engineer on NixOS who follows long technical videos, podcasts and
blogs. Useful means: something they could learn, adopt, try or watch in full
because of a specific part. A brief but concrete mention of a relevant tool or
technique counts; vague hype does not.
"""

