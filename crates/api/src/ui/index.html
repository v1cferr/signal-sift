<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SignalSift</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M1 8h3l2-5 4 10 2-5h3' fill='none' stroke='%2389b4fa' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/ui/app.css">
  <script src="/ui/app.js" defer></script>
</head>
<body>
  <header class="bar">
    <a class="brand" href="#/">SignalSift</a>
    <nav class="controls">
      <label class="field">janela
        <select id="days" aria-label="Janela dos destaques">
          <option value="7">7 dias</option>
          <option value="14" selected>14 dias</option>
          <option value="30">30 dias</option>
          <option value="90">90 dias</option>
        </select>
      </label>
      <label class="field">perfil
        <select id="profile" aria-label="Perfil de execução">
          <option value="balanced">equilibrado</option>
          <option value="gaming">jogos</option>
          <option value="eco">economia</option>
        </select>
      </label>
      <button id="token" class="ghost" type="button">token</button>
    </nav>
  </header>

  <main id="view" aria-live="polite"></main>

  <footer class="foot">
    <span id="status">conectando…</span>
    <span class="muted">A relevância é uma estimativa de preferência feita por um modelo local, não uma medida de verdade.</span>
  </footer>

  <dialog id="token-dialog">
    <form method="dialog" class="token-form">
      <h2>Token da API</h2>
      <p class="muted">Necessário só para enviar 👍/👎 ou trocar o perfil. Cole o conteúdo de
        <code>~/.local/state/signalsift/api-token</code>. Ele fica guardado apenas neste navegador.</p>
      <input id="token-input" type="password" autocomplete="off" spellcheck="false" placeholder="64 caracteres hexadecimais">
      <div class="row">
        <button value="forget" class="ghost" type="submit">esquecer</button>
        <button value="cancel" class="ghost" type="submit">cancelar</button>
        <button value="save" type="submit">salvar</button>
      </div>
    </form>
  </dialog>
</body>
</html>
