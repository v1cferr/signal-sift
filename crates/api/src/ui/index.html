<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SignalSift</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M1 8h3l2-5 4 10 2-5h3' fill='none' stroke='%2389b4fa' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/ui/app.css">
  <script src="/ui/app.js" defer></script>
</head>
<body>
  <header class="bar">
    <a class="brand" href="#/">SignalSift</a>
    <nav class="controls">
      <label class="field">window
        <select id="days" aria-label="Feed window">
          <option value="7">7 days</option>
          <option value="14" selected>14 days</option>
          <option value="30">30 days</option>
          <option value="90">90 days</option>
        </select>
      </label>
      <label class="field">profile
        <select id="profile" aria-label="Execution profile">
          <option value="balanced">balanced</option>
          <option value="gaming">gaming</option>
          <option value="eco">eco</option>
        </select>
      </label>
      <button id="token" class="ghost" type="button">token</button>
    </nav>
  </header>

  <main id="view" aria-live="polite"></main>

  <footer class="foot">
    <span id="status">connecting…</span>
    <span class="muted">Relevance is a preference estimate from a local model, not a measure of truth.</span>
  </footer>

  <dialog id="token-dialog">
    <form method="dialog" class="token-form">
      <h2>API token</h2>
      <p class="muted">Needed only to send feedback or switch profiles. Paste the contents of
        <code>~/.local/state/signalsift/api-token</code>. It is kept in this browser only.</p>
      <input id="token-input" type="password" autocomplete="off" spellcheck="false" placeholder="64 hex characters">
      <div class="row">
        <button value="forget" class="ghost" type="submit">forget</button>
        <button value="cancel" class="ghost" type="submit">cancel</button>
        <button value="save" type="submit">save</button>
      </div>
    </form>
  </dialog>
</body>
</html>
