# cargo-deny: keeps the dependency tree compatible with "MIT OR Apache-2.0".
# Run with `cargo deny check`. See docs/adr/0007-license.md.

[graph]
all-features = false

[advisories]
# Unmaintained crates are reported but do not fail the build by themselves;
# vulnerabilities do.
unmaintained = "workspace"

[licenses]
# Permissive licenses only. Anything copyleft must be a conscious decision
# recorded in an ADR, not a transitive surprise.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

# Mozilla's CA certificate bundle, shipped as data (via reqwest's rustls
# platform verifier). CDLA-Permissive-2.0 is a permissive data license; it is
# allowed for this crate only, not globally. See docs/adr/0007-license.md.
[[licenses.exceptions]]
crate = "webpki-root-certs"
allow = ["CDLA-Permissive-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal path dependencies have no version; that is fine for crates that
# are never published (publish = false in the workspace).
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
